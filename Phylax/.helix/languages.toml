# Pyright must be installed separately; Ruff is provided by the uv project environment.
[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "uv"
args = ["run", "--project", ".", "ruff", "server"]

[[language]]
name = "python"
language-servers = [{ name = "pyright", except-features = ["format"] }, "ruff"]
formatter = { command = "uv", args = ["run", "--project", ".", "ruff", "format", "--stdin-filename", "%{buffer_name}", "-"] }
auto-format = true
roots = ["pyproject.toml", "uv.lock", ".git"]
